[project]
name = "agent-smith"
version = "0.1.0"
description = "Agentic framework that solves MBPP and SWE-bench tasks via a Thought -> Code -> Observation loop"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "requests>=2.32.0",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agent-smith = "agent_smith:main"
sandbox = "agent_smith:sandbox_main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
